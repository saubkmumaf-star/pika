<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="59-lt8zZUYOM6qVl2YgOfNTazAAh8OQVYp5tF4VXz2w" />

    <script src="config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Secure Voice</title>
    <script>
        // Auth guard
        try {
            if (!localStorage.getItem('chet_token')) {
                window.location.replace('join.html');
            }
        } catch(e) { window.location.replace('join.html'); }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Cropper.js -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        :root {
            --bg: #090c13;
            --surface: #121824;
            --surface-card: #182030;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --accent1: #7c6cff;
            --accent2: #a855f7;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --verified-blue: #1d9bf0;
            --online-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .profile-container {
            width: 100%;
            max-width: 900px;
            background: var(--surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        /* ─── COVER BANNER ─── */
        .cover-container {
            width: 100%;
            height: 220px;
            position: relative;
            background: linear-gradient(135deg, #1e1b4b, #311b92, #4a148c);
            overflow: hidden;
        }

        .cover-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: none;
        }

        .cover-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 60%, rgba(18,24,36,0.8) 100%);
        }

        .cover-actions {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(0, 0, 0, 0.7);
            transform: scale(1.05);
        }

        .change-cover-btn {
            position: absolute;
            right: 16px;
            bottom: 16px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            z-index: 10;
        }

        .change-cover-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        /* ─── MAIN CONTENT ─── */
        .profile-body {
            padding: 0 24px 40px 24px;
            position: relative;
        }

        /* Top Row: Avatar & Action Buttons */
        .avatar-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: -65px;
            margin-bottom: 20px;
            position: relative;
            z-index: 5;
        }

        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid var(--surface);
            background: var(--surface-card);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .avatar-placeholder {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
        }

        .status-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--online-green);
            border: 3.5px solid var(--surface);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .status-badge.offline {
            background: #6b7280;
            box-shadow: none;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 6px;
        }

        .btn-edit {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-hover);
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 24px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-edit:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .btn-action-primary {
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            border: none;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 24px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(124, 108, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(124, 108, 255, 0.45);
        }

        .btn-action-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 24px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Profile Details Text */
        .user-names {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .display-name {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
        }
        .verified-badge svg {
            width: 22px;
            height: 22px;
        }

        .username-text {
            font-size: 15px;
            color: var(--muted);
            font-weight: 500;
        }

        .tagline-text {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .bio-text {
            font-size: 15px;
            color: #e5e7eb;
            line-height: 1.55;
            margin-bottom: 18px;
            white-space: pre-line;
            max-width: 680px;
        }

        /* Meta Info (Location & Joined Date) */
        .meta-info-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 24px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta-item svg {
            color: #9ca3af;
            flex-shrink: 0;
        }

        /* ─── EDIT MODAL ─── */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #161c2a;
            border: 1px solid var(--border-hover);
            border-radius: 20px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 14px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }

        .form-group input, .form-group textarea {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .photo-upload-row {
            display: flex;
            gap: 12px;
        }

        .btn-upload-small {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px dashed var(--border-hover);
            border-radius: 10px;
            padding: 12px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .btn-upload-small:hover {
            background: rgba(255,255,255,0.12);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-cancel {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save {
            background: linear-gradient(135deg, var(--accent1), var(--accent2));
            border: none;
            color: #fff;
            padding: 10px 22px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        /* Location Autocomplete */
        .location-autocomplete {
            position: relative;
        }

        .location-autocomplete input {
            width: 100%;
        }

        .location-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #1a2235;
            border: 1px solid var(--border-hover);
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 200;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .location-dropdown.open {
            display: block;
            animation: dropFadeIn 0.15s ease;
        }

        @keyframes dropFadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .location-dropdown::-webkit-scrollbar {
            width: 4px;
        }
        .location-dropdown::-webkit-scrollbar-track { background: transparent; }
        .location-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .location-item {
            padding: 10px 14px;
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.12s;
        }

        .location-item:hover, .location-item.active {
            background: rgba(124, 108, 255, 0.15);
        }

        .location-item .loc-flag {
            font-size: 18px;
            flex-shrink: 0;
        }

        .location-item .loc-name {
            flex: 1;
        }

        .location-no-results {
            padding: 14px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(18, 24, 36, 0.95);
            border: 1px solid var(--accent1);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Upload Overlay */
        .upload-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .upload-overlay.active { display: flex; }
        .upload-spinner {
            width: 45px; height: 45px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--accent1);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Cropper Modal */
        .crop-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 10000;
            display: none;
            flex-direction: column;
            align-items: center; justify-content: center;
        }
        .crop-modal-overlay.active { display: flex; }
        .crop-container {
            width: 90%; max-width: 600px;
            background: var(--surface-card);
            border-radius: 16px;
            padding: 20px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .img-crop-wrap {
            width: 100%; height: 60vh;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .crop-actions { display: flex; justify-content: flex-end; gap: 12px; }

        /* Responsive Mobile Adjustments matching prompt images */
        @media (max-width: 640px) {
            .cover-container {
                height: 170px;
            }
            .avatar-wrapper {
                width: 105px;
                height: 105px;
            }
            .avatar-row {
                margin-top: -50px;
            }
            .display-name {
                font-size: 22px;
            }
            .profile-body {
                padding: 0 16px 30px 16px;
            }
            .action-buttons {
                gap: 6px;
            }
            .btn-edit, .btn-action-primary {
                padding: 8px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- Upload Overlay -->
    <div class="upload-overlay" id="uploadOverlay">
        <div class="upload-spinner"></div>
        <h3 id="uploadStatusText">Uploading... Please wait</h3>
    </div>

    <!-- Cropper Modal -->
    <div class="crop-modal-overlay" id="cropModal">
        <div class="crop-container">
            <h3 style="color:#fff; font-family: 'Plus Jakarta Sans', sans-serif;">Crop Image</h3>
            <div class="img-crop-wrap">
                <img id="cropperImage" src="" style="display:block;max-width:100%;">
            </div>
            <div class="crop-actions">
                <div style="flex:1; display:flex; gap:8px;">
                    <button class="btn-cancel" onclick="if(cropperInstance) cropperInstance.zoom(0.1)" title="Zoom In" style="padding: 8px 12px;">Zoom +</button>
                    <button class="btn-cancel" onclick="if(cropperInstance) cropperInstance.zoom(-0.1)" title="Zoom Out" style="padding: 8px 12px;">Zoom -</button>
                </div>
                <button class="btn-cancel" onclick="closeCropper()">Cancel</button>
                <button class="btn-save" onclick="saveCroppedImage()">Crop & Save</button>
            </div>
        </div>
    </div>

    <div class="profile-container">

        <!-- Cover Banner -->
        <div class="cover-container" id="coverBanner">
            <img class="cover-img" id="coverImgEl" src="" alt="Cover photo">
            <div class="cover-overlay"></div>
            <div class="cover-actions">
                <button class="icon-btn" onclick="goBack()" title="Back">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <button class="icon-btn" id="settingsBtn" onclick="openEditModal()" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
            <button class="change-cover-btn" id="changeCoverBtn" onclick="document.getElementById('coverInput').click()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                Change Cover
            </button>
            <input type="file" id="coverInput" accept="image/*" style="display:none" onchange="handleCoverUpload(event)">
        </div>

        <!-- Main Body -->
        <div class="profile-body">
            
            <!-- Avatar & Actions -->
            <div class="avatar-row">
                <div class="avatar-wrapper" id="avatarContainer">
                    <div class="avatar-placeholder" id="avatarText">?</div>
                    <div class="status-badge" id="statusBadge"></div>
                </div>
                <div class="action-buttons" id="actionButtons">
                    <!-- Loaded dynamically (Edit Profile or Call/Message) -->
                </div>
            </div>

            <!-- Names -->
            <div class="user-names">
                <div class="name-row">
                    <h1 class="display-name" id="displayName">Loading...</h1>
                    <div id="verifiedContainer"></div>
                </div>
                <div class="username-text" id="usernameDisplay">@username</div>
            </div>

            <!-- Tagline -->
            <div class="tagline-text" id="taglineDisplay" style="display:none"></div>

            <!-- Bio -->
            <div class="bio-text" id="bioDisplay" style="display:none"></div>

            <!-- Meta Details: Location & Joined Date -->
            <div class="meta-info-row">
                <div class="meta-item" id="locationItem" style="display:none">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <span id="locationText">Dhaka, Bangladesh</span>
                </div>
                <div class="meta-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <span id="joinedText">Joined Date</span>
                </div>
            </div>

        </div>

    </div>

    <!-- Edit Profile Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title">Edit Profile</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>

        function filterTaglines(query) {
            const drop = document.getElementById('taglineDropdown');
            const q = query.trim().toLowerCase();
            const list = q
                ? TAGLINES.filter(t => t.toLowerCase().includes(q)).slice(0, 8)
                : TAGLINES.slice(0, 8);
            if (!list.length) {
                drop.innerHTML = '<div class="location-no-results">No suggestions</div>';
                drop.classList.add('open');
                return;
            }
            drop.innerHTML = list.map((t, i) => {
                const hi = q ? t.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<strong>$1</strong>') : t;
                return `<div class="location-item" data-idx="${i}" onmousedown="selectTagline('${t.replace(/'/g,"\\'")}')"><span class="loc-name">${hi}</span></div>`;
            }).join('');
            drop.classList.add('open');
            activeTagIdx = -1;
        }

        function filterLocations(query) {
            const drop = document.getElementById('locationDropdown');
            const q = query.trim().toLowerCase();
            if (!q) {
                drop.classList.remove('open');
                drop.innerHTML = '';
                return;
            }
            const filtered = COUNTRIES.filter(c => c.n.toLowerCase().includes(q)).slice(0, 10);
            if (!filtered.length) {
                drop.innerHTML = '<div class="location-no-results">No results found</div>';
                drop.classList.add('open');
                return;
            }
            drop.innerHTML = filtered.map((c, i) =>
                `<div class="location-item" data-idx="${i}" onmousedown="selectLocation('${c.n.replace(/'/g,"\\'")}')">
                    <span class="loc-flag">${c.f}</span>
                    <span class="loc-name">${c.n.replace(new RegExp(`(${q})`, 'gi'), '<strong>$1</strong>')}</span>
                </div>`
            ).join('');
            drop.classList.add('open');
            activeLocIdx = -1;
        }

        // Close dropdowns on outside click

            if (!document.getElementById('locationAutocomplete')?.contains(e.target)) {
                const drop = document.getElementById('locationDropdown');
                if (drop) drop.classList.remove('open');
            }
            if (!document.getElementById('taglineAutocomplete')?.contains(e.target)) {
                const drop = document.getElementById('taglineDropdown');
                if (drop) drop.classList.remove('open');
            }
        });

        // Arrow key navigation in dropdowns
        document.addEventListener('keydown', function(e) {
            // Location dropdown
            const locDrop = document.getElementById('locationDropdown');
            if (locDrop && locDrop.classList.contains('open')) {
                const items = locDrop.querySelectorAll('.location-item');
                if (items.length) {
                    if (e.key === 'ArrowDown') { e.preventDefault(); activeLocIdx = Math.min(activeLocIdx + 1, items.length - 1); items.forEach((el,i) => el.classList.toggle('active', i === activeLocIdx)); items[activeLocIdx]?.scrollIntoView({block:'nearest'}); }
                    else if (e.key === 'ArrowUp') { e.preventDefault(); activeLocIdx = Math.max(activeLocIdx - 1, 0); items.forEach((el,i) => el.classList.toggle('active', i === activeLocIdx)); items[activeLocIdx]?.scrollIntoView({block:'nearest'}); }
                    else if (e.key === 'Enter' && activeLocIdx >= 0) { e.preventDefault(); items[activeLocIdx]?.dispatchEvent(new MouseEvent('mousedown')); }
                    else if (e.key === 'Escape') locDrop.classList.remove('open');
                    return;
                }
            }
            // Tagline dropdown
            const tagDrop = document.getElementById('taglineDropdown');
            if (tagDrop && tagDrop.classList.contains('open')) {

        function formatJoinedDate(isoString) {
            if (!isoString) return 'Joined Recently';
            let safeIso = isoString;
            if (!safeIso.includes('Z') && !safeIso.includes('+')) safeIso += 'Z';
            const date = new Date(safeIso);
            if (isNaN(date.getTime())) return 'Joined Recently';
            
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `Joined ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
        }

        function renderProfile(user) {
            currentProfileData = user;

            const coverImg = document.getElementById('coverImgEl');

            if (user.cover_photo) {
                coverImg.src = user.cover_photo;
                coverImg.style.display = 'block';
                coverBanner.style.backgroundImage = 'none';
            } else {
                coverImg.style.display = 'none';

                coverBanner.style.backgroundImage = 'linear-gradient(135deg, #1e1b4b, #311b92, #4a148c)';
            }

            // 2. Avatar & Online status
            const avatarContainer = document.getElementById('avatarContainer');
            const avatarText = document.getElementById('avatarText');

                let img = document.getElementById('avatarImgEl');
                if (!img) {
                    img = document.createElement('img');
                    img.id = 'avatarImgEl';
                    img.className = 'avatar-img';
                    avatarContainer.appendChild(img);
                }
                img.src = user.profile_photo;
                avatarText.style.display = 'none';
            } else {
                const img = document.getElementById('avatarImgEl');
                if (img) img.remove();
                avatarText.style.display = 'flex';
                const initials = (user.first_name ? user.first_name[0] : (user.username ? user.username[0] : '?')).toUpperCase();

            }

            const statusBadge = document.getElementById('statusBadge');

                statusBadge.classList.remove('offline');

                statusBadge.classList.add('offline');
            }

            document.getElementById('displayName').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim() || user.username;

            if (user.is_verified) {
                verContainer.innerHTML = `<span class="verified-badge"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="#1d9bf0"/><path d="M9.5 16.5l-3-3 1.4-1.4 1.6 1.6 5.6-5.6 1.4 1.4z" fill="#fff"/></svg></span>`;
            } else {
                verContainer.innerHTML = '';
            }

            if (user.tagline) {
                taglineEl.textContent = user.tagline;
                taglineEl.style.display = 'block';
            } else {
                taglineEl.style.display = 'none';
            }

            // 5. Bio

            if (user.bio) {
                bioEl.textContent = user.bio;
                bioEl.style.display = 'block';
            } else {
                bioEl.style.display = 'none';

            if (user.location) {
                document.getElementById('locationText').textContent = user.location;
                locItem.style.display = 'flex';
            } else {
                locItem.style.display = 'none';

            if (isOwnProfile) {
                changeCoverBtn.style.display = 'flex';
                actionContainer.innerHTML = `
                    <button class="btn-edit" onclick="openEditModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        Edit Profile
                    </button>
                `;
            } else {
                changeCoverBtn.style.display = 'none';
                actionContainer.innerHTML = `
                    <button class="btn-action-primary" onclick="startCallFromProfile()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.1a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6 6l1.27-.85a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        Call
                    </button>
                    <button class="btn-action-secondary" onclick="startChatFromProfile()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                        Message
                    </button>
                `;
            }
        }

        async function loadProfileData() {
            try {
                const endpoint = isOwnProfile ? `${API}/api/auth/me` : `${API}/api/users/${encodeURIComponent(profileUid)}`;
                const res = await fetch(endpoint, {
                    headers: { Authorization: 'Bearer ' + token }
                });
                if (res.status === 401) { window.location.href = 'join.html'; return; }
                const data = await res.json();
                if (!res.ok || data.error) { showToast(data.error || 'Failed to load profile'); return; }

                if (isOwnProfile) {
                    // Full sync — merge API data so all fields (cover_photo, bio, etc.) persist across login
                    myUser = { ...myUser, ...data };
                    localStorage.setItem('chet_user', JSON.stringify(myUser));
                }
                renderProfile(data);
            } catch(e) {
                console.error('[PROFILE] Load error:', e);
                showToast('Failed to load profile');
            }
        }

        // Edit Profile Modal
        function openEditModal() {
            if (!currentProfileData || !isOwnProfile) return;
            document.getElementById('inputFirstName').value = currentProfileData.first_name || '';
            document.getElementById('inputLastName').value = currentProfileData.last_name || '';
            document.getElementById('inputTagline').value = currentProfileData.tagline || '';
            document.getElementById('inputBio').value = currentProfileData.bio || '';
            document.getElementById('inputLocation').value = currentProfileData.location || '';
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        async function saveProfileChanges() {
            const firstName = document.getElementById('inputFirstName').value.trim();
            const lastName = document.getElementById('inputLastName').value.trim();
            const tagline = document.getElementById('inputTagline').value.trim();
            const bio = document.getElementById('inputBio').value.trim();
            const location = document.getElementById('inputLocation').value.trim();

            try {
                const res = await fetch(`${API}/api/users/profile`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        first_name: firstName,
                        last_name: lastName,
                        tagline,
                        bio,
                        location
                    })
                });
                const data = await res.json();
                if (data.success) {
                    closeEditModal();
                    showToast('Profile updated!');
                    if (data.user) {
                        myUser = data.user;
                        localStorage.setItem('chet_user', JSON.stringify(myUser));
                        renderProfile(data.user);
                    } else {
                        loadProfileData();
                    }
                } else {
                    showToast(data.error || 'Failed to save changes');
                }
            } catch(e) {
                showToast('Error saving profile');
            }
        }

        // Image compress helper
        function compressImage(file, maxPx, quality, callback) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                // Skip compression for GIFs and WEBPs (stickers) to keep them animated
                if (file.type === 'image/gif' || file.type === 'image/webp') {
                    callback(evt.target.result);
                    return;
                }
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxPx) { height *= maxPx / width; width = maxPx; }
                    } else {
                        if (height > maxPx) { width *= maxPx / height; height = maxPx; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        let isUploading = false;

        function setUploadState(active, text = 'Uploading... Please wait') {
            isUploading = active;
            const overlay = document.getElementById('uploadOverlay');
            document.getElementById('uploadStatusText').textContent = text;
            if (active) {
                overlay.classList.add('active');
                document.getElementById('avatarInput').disabled = true;
                document.getElementById('coverInput').disabled = true;
            } else {
                overlay.classList.remove('active');
                document.getElementById('avatarInput').disabled = false;
                document.getElementById('coverInput').disabled = false;
            }
        }

        let cropperInstance = null;
        let cropTarget = null; // 'avatar' or 'cover'
        let currentFileMime = '';

        function openCropper(imageUrl, type) {
            cropTarget = type;
            const img = document.getElementById('cropperImage');
            img.src = imageUrl;
            document.getElementById('cropModal').classList.add('active');
            
            if (cropperInstance) {
                cropperInstance.destroy();
            }
            
            cropperInstance = new Cropper(img, {
                aspectRatio: type === 'avatar' ? 1 : 1400 / 220,
                viewMode: 1,
                background: false,
                autoCropArea: 1,
            });
        }

        function closeCropper() {
            document.getElementById('cropModal').classList.remove('active');
            if (cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
            }
            document.getElementById('avatarInput').value = '';
            document.getElementById('coverInput').value = '';
        }

        async function uploadProfileImage(type, base64) {
            try {
                const payload = {};
                payload[type === 'avatar' ? 'profile_photo' : 'cover_photo'] = base64;
                
                const res = await fetch(`${API}/api/users/profile`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`${type === 'avatar' ? 'Avatar' : 'Cover'} updated successfully! ✅`);
                    if (data.user) {
                        myUser = { ...myUser, ...data.user };
                        localStorage.setItem('chet_user', JSON.stringify(myUser));
                        renderProfile(myUser);
                    } else {
                        loadProfileData();
                    }
                } else {
                    showToast(data.error || 'Upload failed');
                }
            } catch(err) {
                showToast('Upload error — check connection');
            } finally {
                setUploadState(false);
                document.getElementById('avatarInput').value = '';
                document.getElementById('coverInput').value = '';
            }
        }

        async function saveCroppedImage() {
            if (!cropperInstance) return;
            const type = cropTarget;
            const canvas = cropperInstance.getCroppedCanvas({
                width: type === 'avatar' ? 400 : 1400,
                height: type === 'avatar' ? 400 : 220
            });
            const format = currentFileMime === 'image/png' ? 'image/png' : 'image/jpeg';
            const base64 = canvas.toDataURL(format, 0.85);
            closeCropper();
            
            setUploadState(true, `Uploading ${type === 'avatar' ? 'Avatar' : 'Cover'}...`);
            uploadProfileImage(type, base64);
        }

        function handleAvatarUpload(e) {
            if (isUploading) return;
            const file = e.target.files[0];
            if (!file) return;

            const mb = (file.size / 1024 / 1024).toFixed(2);
            if (file.size > 5 * 1024 * 1024) {
                showToast(`Image too large (${mb} MB). Max 5 MB.`);
                e.target.value = '';
                return;
            }

            if (file.type === 'image/gif' || file.type === 'image/webp') {
                if (file.size > 1.5 * 1024 * 1024) {
                    showToast(`GIF/Sticker too large (${mb} MB). Max 1.5 MB to prevent lag.`);
                    e.target.value = '';
                    return;
                }
                setUploadState(true, 'Uploading Avatar (GIF/Sticker)...');
                compressImage(file, 400, 0.85, async (base64) => {
                    uploadProfileImage('avatar', base64);
                });
                return;
            }

            const reader = new FileReader();
            reader.onload = function(evt) {
                currentFileMime = file.type;
                openCropper(evt.target.result, 'avatar');
            };
            reader.readAsDataURL(file);
        }

        function handleCoverUpload(e) {
            if (isUploading) return;
            const file = e.target.files[0];
            if (!file) return;

            const mb = (file.size / 1024 / 1024).toFixed(2);
            if (file.size > 7 * 1024 * 1024) {
                showToast(`Cover too large (${mb} MB). Max 7 MB.`);
                e.target.value = '';
                return;
            }

            if (file.type === 'image/gif' || file.type === 'image/webp') {
                if (file.size > 1.5 * 1024 * 1024) {
                    showToast(`GIF/Sticker too large (${mb} MB). Max 1.5 MB to prevent lag.`);
                    e.target.value = '';
                    return;
                }
                setUploadState(true, 'Uploading Cover (GIF/Sticker)...');
                compressImage(file, 1400, 0.82, async (base64) => {
                    uploadProfileImage('cover', base64);
                });
                return;
            }

            const reader = new FileReader();
            reader.onload = function(evt) {
                currentFileMime = file.type;
                openCropper(evt.target.result, 'cover');
            };
            reader.readAsDataURL(file);
        }

        // Actions: Call & Message
        async function startCallFromProfile() {
            if (!currentProfileData) return;
            try {
                const r = await fetch(`${API}/api/calls/initiate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ target_uid: currentProfileData.uid })
                });
                if (!r.ok) { showToast('Call initiation failed'); return; }
                const data = await r.json();
                sessionStorage.setItem('activeCall', JSON.stringify({
                    callId: data.callId,
                    sessionId: data.sessionId,
                    secondsConnected: 0,
                    isMuted: false,
                    isVideoMuted: true,
                    isCaller: true
                }));
                sessionStorage.setItem('callPartner', JSON.stringify(currentProfileData));
                if (socket) {
                    socket.emit('incoming_call', {
                        to_uid: currentProfileData.uid,
                        caller: myUser,
                        callId: data.callId
                    });
                }
                window.location.href = 'index.html';
            } catch(e) {
                showToast('Connection error');
            }
        }

        function startChatFromProfile() {
            if (!currentProfileData) return;
            sessionStorage.setItem('chatPartner', JSON.stringify(currentProfileData));
            window.location.href = 'chat.html';
        }

        function goBack() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('from') === 'chat') {
                window.location.href = 'chat.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        // Realtime Sockets
        function initSockets() {
            var s = document.createElement('script');
            s.src = API + '/socket.io/socket.io.js';
            s.onload = function() {
                socket = io(API, { transports: ['websocket', 'polling'] });
                window.socket = socket;
                socket.on('connect', () => socket.emit('register_user', token));
                
                socket.on('profile_updated', (updatedUser) => {
                    if (updatedUser.uid === profileUid) {
                        loadProfileData();
                    }
                });

                socket.on('user_status', (data) => {
                    if (data.uid === profileUid) {
                        const badge = document.getElementById('statusBadge');
                        if (data.is_online) badge.classList.remove('offline');
                        else badge.classList.add('offline');
                    }
                });
            };
            document.head.appendChild(s);
        }

        // Init — render instantly from cache/local if available
        if (isOwnProfile && myUser && myUser.uid) {
            renderProfile(myUser);
        } else if (!isOwnProfile) {
            try {
                const cached = JSON.parse(sessionStorage.getItem('viewProfileCache') || 'null');
                if (cached && cached.uid === profileUid) {
                    renderProfile(cached);
                }
            } catch(e) {}
        }

        loadProfileData();
        initSockets();
    </script>
    
</body>
